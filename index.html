<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Candy & Team Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Pokémon Team Candy Calculator</h1>
      <p>Build your team of up to 6 Pokémon, calculate required Exp. Candies, and estimate Mega Shards costs.</p>
    </header>

    <!-- Global Settings / Filters -->
    <section class="card filter-section">
      <h3>Allowed Exp. Candy Sizes</h3>
      <p class="section-desc">Uncheck sizes you do not wish to use in calculation (e.g. limit to S, M, L):</p>
      <div class="candy-filter-group">
        <label class="toggle-pill">
          <input type="checkbox" value="XS" class="candy-toggle">
          <span>XS (100)</span>
        </label>
        <label class="toggle-pill">
          <input type="checkbox" value="S" class="candy-toggle" checked>
          <span>S (800)</span>
        </label>
        <label class="toggle-pill">
          <input type="checkbox" value="M" class="candy-toggle" checked>
          <span>M (3,000)</span>
        </label>
        <label class="toggle-pill">
          <input type="checkbox" value="L" class="candy-toggle" checked>
          <span>L (10,000)</span>
        </label>
        <label class="toggle-pill">
          <input type="checkbox" value="XL" class="candy-toggle">
          <span>XL (30,000)</span>
        </label>
      </div>
    </section>

    <!-- Team Slots Container -->
    <section class="team-section">
      <div class="team-header">
        <h2>Your Team</h2>
        <button id="add-member-btn" class="btn btn-primary">+ Add Team Member</button>
      </div>

      <div id="team-container" class="team-grid">
        <!-- Dynamic slot cards generated by script.js -->
      </div>
    </section>

    <!-- Total Results Section -->
    <section class="summary-section">
      <div id="total-candies-output">
        <!-- Rendered total summary generated by script.js -->
      </div>
    </section>
  </div>
</body>
</html>
